<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/reset.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/add_password.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" href="/static/image/icon.png" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Alien+Block&family=Puritan:ital,wght@0,400;0,700;1,400;1,700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <title>Добавить пароль</title>
</head>
<body>
    <header>
        <div class="header_content">
            <div class="left_elem">
                <div class="header_left">
                    <div class="icon_block">
                        <img src="/static/image/icon.png" alt="Иконка менеджера паролей">
                    </div>
                    <h1>Менеджер паролей</h1>
                </div>
            </div>
            <div class="right_elem">
                <div class="navigate_menu">
                    <a href="/">Главная</a>
                    <div class="palka1"></div>
                    <a href="/account">Личный кабинет</a>
                </div>
            </div>
        </div>
    </header>
    <main>
        <form id="post_password">
            <h3>Добавить пароль</h3>
            <div class="elem_form">
                <div class="form-group">
                    <label for="site_name">Название сайта:</label>
                    <input type="text" id="site_name" name="site_name" placeholder="example.com" required>
                </div>
                
                <div class="form-group">
                    <label for="login">Логин:</label>
                    <input type="text" id="login" name="login" placeholder="user@mail.com" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Пароль:</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                </div>
            </div>
            <button type="submit" id="add_password_btn">Добавить пароль</button>
        </form>
    </main>
    <script src="/static/js/add_password.js"></script>
</body>
</html>
