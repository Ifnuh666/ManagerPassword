<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/css/reset.css">
    <link rel="stylesheet" href="../static/css/registration.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alien+Block&family=Puritan:ital,wght@0,400;0,700;1,400;1,700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <title>Регистрация</title>
</head>
<body>
    <div class="wrapper">
        <div class="form_block">
            <form id="registration-form">
                <h2>Регистрация</h2>
                <div>
                    <label for="login">Логин</label>
                    <input type="text" id="login" name="login" required autocomplete="login">
                </div>
                <div>
                    <label for="password">Пароль</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                </div>
                <div>
                    <label for="repeat_password">Повторите пароль</label>
                    <input type="password" id="repeat_password" name="repeat_password" required autocomplete="current-password">
                </div>
                <button type="submit" id="submit-btn">Зарегистрироваться</button>
            </form>
        </div>
    </div>
    <script src="/static/js/registration.js"></script>
</body>
</html>
