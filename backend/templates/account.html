<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/css/reset.css">
    <link rel="stylesheet" href="../static/css/account.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" href="/static/image/icon.png" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Alien+Block&family=Puritan:ital,wght@0,400;0,700;1,400;1,700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <title>Личный кабинет</title>
</head>
<body>
    <header>
        <div class="header_content">
            <div class="left_elem">
                <div class="header_left">
                    <div class="icon_block">
                        <img src="/static/image/icon.png" alt="Иконка менеджера паролей">
                    </div>
                    <h1>Менеджер паролей</h1>
                </div>
            </div>
            <div class="right_elem">
                <div class="navigate_menu">
                    <a href="/">Главная</a>
                    <div class="palka1"></div>
                    <a href="/account">Личный кабинет</a>
                </div>
            </div>
        </div>
    </header>
    <main>
        <div class="info_user">
            <div class="setting_user">
                <h1>О пользователе</h1>
                <label for="login-user">Логин:</label>
                <input type="text" id="login-user">
                <label for="password">Пароль:</label>
                <input type="password" id="password-user">
                <button type="button" id="exit-button" class="logout-button">Выйти из аккаунта</button>
            </div>
        </div>
    </main>
    <script src="/static/js/account.js"></script>
</body>
</html>
